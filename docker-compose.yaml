services:
  db:
    image: postgres:18
    container_name: soloconference_db
    env_file:
      - ./backend/database.env
    volumes:
      - soloconference_db_data:/var/lib/postgresql
    networks:
      - soloconference_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: soloconference_backend:latest
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - soloconference_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: soloconference_frontend:latest
    build:
      context: ./frontend
      secrets:
        - frontend_env_file
    ports:
      - "5173:80"
    volumes:
      - ./frontend/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - soloconference_network
    depends_on:
      - backend

networks:
  soloconference_network:
    driver: bridge

volumes:
  soloconference_db_data:

secrets:
  frontend_env_file:
    file: ./frontend/.env.local
